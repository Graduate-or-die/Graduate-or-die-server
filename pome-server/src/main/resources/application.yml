server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0

spring:
  config:
    import: optional:file:.env[.properties]   # OK
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}  # 초기엔 update, 안정화 후 validate 권장
    open-in-view: false                                   # 권장
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  jackson:
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false
kakao:
  oauth:
    client-id: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: http://localhost:8080/users/login
    token-uri: https://kauth.kakao.com/oauth/token

jwt:
  secret: ${JWT_SECRET:}
  access-token-validity-in-seconds: 3600
  refresh-token-validity-in-seconds: 1209600

        # dialect는 보통 URL로 자동 판별되므로 생략 가능.
        # 필요 시 명시: dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

cloud:
  aws:
    credentials:
      access-key: ${ACCESS_KEY}
      secret-key: ${SECRET_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: ${BUCKET_NAME}
    stack:
      auto: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  override-with-generic-response: false

