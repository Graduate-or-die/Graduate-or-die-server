server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0

spring:
  config:
    import: optional:file:.env[.properties]   # OK
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}  # 초기엔 update, 안정화 후 validate 권장
    open-in-view: false                                   # 권장
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  jackson:
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false
kakao:
  oauth:
    client-id: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: http://localhost:8080/users/login
    token-uri: https://kauth.kakao.com/oauth/token

        # dialect는 보통 URL로 자동 판별되므로 생략 가능.
        # 필요 시 명시: dialect: org.hibernate.dialect.MySQLDialect
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

