name: Deploy to EC2 via SSH

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle (pome-server module)
        working-directory: pome-server
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::042655075951:role/ec2-ecr-pull-role
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker image
        if: github.event_name == 'push'
        working-directory: pome-server
        run: |
          IMAGE=204265507951.dkr.ecr.ap-northeast-2.amazonaws.com/pome-app
          TAG=${GITHUB_SHA::7}
          docker build -t $IMAGE:$TAG -t $IMAGE:latest -f Dockerfile .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Stop if not push (skip deploy on PR)
        if: github.event_name != 'push'
        run: echo "PR run → build only. Deploy is skipped."

      - name: Write SSH key
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Add EC2 host to known_hosts
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on EC2 (pull & up)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          ssh -i key.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "\
            set -euo pipefail; \
            cd /home/${{ secrets.EC2_USER }}/pome; \
            docker compose pull app; \
            docker compose up -d app; \
            curl -fsS http://127.0.0.1/health/check >/dev/null; \
            echo '[DEPLOY] done'; \
          "
