name: Deploy to EC2 via SSH

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle (pome-server module)
        working-directory: pome-server
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test

      - name: Find built jar
        id: jar
        run: |
          set -euo pipefail
          JAR_PATH=$(find pome-server/build/libs -maxdepth 1 -type f -name "*.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "No jar found under pome-server/build/libs"; exit 1
          fi
          echo "jar=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "Found JAR: $JAR_PATH"

      # 배포는 push 일 때만 실행 (PR은 빌드만)
      - name: Stop if not push (skip deploy on PR)
        if: github.event_name != 'push'
        run: echo "PR run → build only. Deploy is skipped."

      - name: Write SSH key
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Add EC2 host to known_hosts
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts


      # EC2 고정 경로의 jar만 교체 (app 재시작/재기동 안 함)
      - name: Copy JAR to EC2 (replace only)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          ssh -i key.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "\
            set -euo pipefail; \
            mkdir -p /home/${{ secrets.EC2_USER }}/pome/app; \
          "
          scp -i key.pem "${{ steps.jar.outputs.jar }}" "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/pome/app/app.jar"

      # app이 켜져 있으면 health 체크, 꺼져 있으면 스킵 (실패 처리 안 함)
      - name: Post-check (health if app is running)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          ssh -i key.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "\
            set -euo pipefail; \
            if docker ps --format '{{.Names}}' | grep -q '^pome-app$'; then \
              echo '[CHECK] app container is running -> health check'; \
              curl -fsS http://127.0.0.1/health/check >/dev/null; \
              echo '[CHECK] health ok'; \
            else \
              echo '[CHECK] app is OFF -> skip health check (A-mode)'; \
            fi \
          "
