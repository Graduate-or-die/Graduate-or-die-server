name: Deploy to EC2 on main

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_PATH: ${{ secrets.EC2_PATH || '/opt/app' }}
      HEALTH_URL: ${{ secrets.HEALTH_URL || 'http://127.0.0.1:8080/health/check' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 기준
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build (Gradle)
        run: |
          chmod +x gradlew || true
          ./gradlew clean bootJar -x test

      - name: Find built jar
        id: jar
        run: |
          # Gradle 부트Jar 기본 위치 예시
          JAR_PATH=$(find build/libs -maxdepth 1 -type f -name "*.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            # Maven 기본 위치 예시
            JAR_PATH=$(find target -maxdepth 1 -type f -name "*.jar" | head -n 1)
          fi
          if [ -z "$JAR_PATH" ]; then
            echo "No jar found"; exit 1
          fi
          echo "jar=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "Found JAR: $JAR_PATH"

      - name: Write SSH key
        run: |
          echo "$EC2_SSH_KEY" > key.pem
          chmod 600 key.pem

      - name: Add EC2 to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy JAR to EC2
        run: |
          scp -i key.pem "${{ steps.jar.outputs.jar }}" "$EC2_USER@$EC2_HOST:/home/$EC2_USER/app-new.jar"

      - name: Run deploy script on EC2
        run: |
          ssh -i key.pem "$EC2_USER@$EC2_HOST" "\
            /opt/app/deploy.sh /home/$EC2_USER/app-new.jar && \
            rm -f /home/$EC2_USER/app-new.jar \
          "
